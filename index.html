<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Admission Registration Form</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f2f4f7;
    color: #222;
    margin: 0;
    padding: 24px 12px;
  }

  .form-container {
    max-width: 700px;
    margin: 0 auto;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 28px 30px 34px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 8px;
    text-align: center;
    color: #1a3c6e;
  }

  .description {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  fieldset {
    border: 1px solid #d4dbe5;
    border-radius: 6px;
    padding: 16px 18px 20px;
    margin: 0 0 20px;
  }

  legend {
    font-size: 15px;
    font-weight: bold;
    color: #1a3c6e;
    padding: 0 6px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field:last-child {
    margin-bottom: 0;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="date"],
  input[type="password"],
  select,
  textarea,
  input[type="file"] {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 14px;
    border: 1px solid #c2c9d4;
    border-radius: 4px;
    background-color: #fff;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid #4a7fd4;
    outline-offset: 1px;
    border-color: #4a7fd4;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    font-size: 14px;
  }

  .options label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: normal;
    margin-bottom: 0;
  }

  .options input {
    margin: 0;
  }

  .hint {
    font-size: 12px;
    color: #777;
    margin: 4px 0 0;
  }

  .declaration {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 20px;
  }

  .declaration label {
    font-weight: normal;
    margin-bottom: 0;
  }

  .buttons {
    display: flex;
    gap: 12px;
  }

  button {
    flex: 1;
    padding: 11px 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
  }

  button[type="submit"] {
    background-color: #1a3c6e;
    color: #fff;
  }

  button[type="submit"]:hover {
    background-color: #14304f;
  }

  button[type="reset"] {
    background-color: #fff;
    color: #1a3c6e;
    border-color: #1a3c6e;
  }

  button[type="reset"]:hover {
    background-color: #eef2f8;
  }
</style>
</head>
<body>

<div class="form-container">
  <h1>College Admission Registration Form</h1>
  <p class="description">
    Please fill in the details below to apply for admission. Fields marked with
    <strong>*</strong> are required.
  </p>

  <form action="#" method="post" enctype="multipart/form-data">

    <fieldset>
      <legend>Personal Information</legend>

      <div class="field">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
               minlength="3" maxlength="60" required>
      </div>

      <div class="field">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number"
               pattern="[0-9]{10}" maxlength="10" required>
        <p class="hint">Enter a 10-digit number without spaces or dashes.</p>
      </div>

      <div class="field">
        <label for="dob">Date of Birth *</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <div class="field">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password" placeholder="Minimum 8 characters"
               minlength="8" required>
      </div>

      <div class="field">
        <label>Gender *</label>
        <div class="options">
          <label><input type="radio" name="gender" value="female" required> Female</label>
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Academic Details</legend>

      <div class="field">
        <label for="course">Preferred Course *</label>
        <select id="course" name="course" required>
          <option value="">-- Select a course --</option>
          <option value="btech-cse">B.Tech CSE</option>
          <option value="btech-aiml">B.Tech AI/ML</option>
          <option value="bba">BBA</option>
          <option value="bca">BCA</option>
        </select>
      </div>

      <div class="field">
        <label>Interests</label>
        <div class="options">
          <label><input type="checkbox" name="interests" value="coding"> Coding</label>
          <label><input type="checkbox" name="interests" value="sports"> Sports</label>
          <label><input type="checkbox" name="interests" value="music"> Music</label>
          <label><input type="checkbox" name="interests" value="reading"> Reading</label>
        </div>
      </div>

      <div class="field">
        <label for="address">Address *</label>
        <textarea id="address" name="address" rows="4" placeholder="House no., street, city, state, PIN code"
                  required></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Documents</legend>

      <div class="field">
        <label for="photo">Passport Size Photograph *</label>
        <input type="file" id="photo" name="photo" accept="image/*" required>
      </div>

      <div class="field">
        <label for="documents">Supporting Documents</label>
        <input type="file" id="documents" name="documents" accept=".pdf,.jpg,.jpeg,.png" multiple>
        <p class="hint">Upload marksheets or certificates (PDF, JPG or PNG).</p>
      </div>
    </fieldset>

    <div class="declaration">
      <input type="checkbox" id="declaration" name="declaration" value="accepted" required>
      <label for="declaration">
        I hereby declare that the information provided above is true and correct to the best of my knowledge.
      </label>
    </div>

    <div class="buttons">
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </div>

  </form>
</div>

</body>
</html>
